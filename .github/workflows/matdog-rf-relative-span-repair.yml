name: MATDOG RF Relative Span Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/matdog-rf-relative-span-repair.yml
      - tools/matdog/apply_rf_relative_span_repair.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matdog-rf-relative-span-repair
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Replace absolute RF endpoints with relative LF V25 span
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RF branch
        uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0

      - name: Prove expected repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "matdog/rf-native-calibrator"
          test -f tools/matdog/apply_rf_relative_span_repair.py
          test -f .github/workflows/matdog-rf-relative-span-repair.yml
          python3 -m py_compile tools/matdog/apply_rf_relative_span_repair.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Apply relative-span repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/matdog/apply_rf_relative_span_repair.py
          rustfmt --edition 2021 \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          git diff --check

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('software/drivers/st3215/src/auto_calibrate/matdog.rs').read_text()
          tests = Path('software/drivers/st3215/src/auto_calibrate/matdog_test.rs').read_text()
          required = (
              'const RF_MIRROR_SPAN_TOLERANCE_TICKS: u16 = REPEATABILITY_TOLERANCE_TICKS;',
              'relative_contact_entry_tick: Option<u16>',
              'fn lf_v25_reference_span_ticks(',
              'fn rf_relative_second_contact_entry_tick(',
              'fn configure_rf_relative_second_contact_entry(',
              'fn rf_measured_span_ticks(',
              'fn rf_span_witness_deviation(',
              'MATDOG RF RELATIVE LF V25 SPAN WITNESS',
              'rf_witness_uses_lf_v25_travel_span_not_absolute_encoder_coordinates',
              'rf_second_contact_entry_is_anchored_to_first_measured_contact',
              'rf_observed_hip_plateau_is_bypassed_relative_to_first_contact',
              'rf_span_witness_rejects_short_travel_even_when_affine_band_is_broad',
              'lf_v25_profiles_never_receive_rf_relative_entries',
          )
          combined = source + tests
          missing = [token for token in required if token not in combined]
          forbidden = (
              'RF_MIRROR_WITNESS_TOLERANCE_TICKS',
              'RF_MIRROR_SEARCH_ENTRY_TOLERANCE_TICKS',
              'reference_contact_tick_for_profile(',
              'rf_mirror_search_entry_tick(',
              'contact_witness_deviations_for_leg(',
              'Leg::Rf => true',
          )
          conflicts = [token for token in forbidden if token in source]
          if missing or conflicts:
              raise SystemExit(f'missing={missing}; conflicts={conflicts}')
          print('relative LF V25 RF span contract: PASS')
          PY

      - name: Run warning-free complete ST3215 regression
        shell: bash
        run: |
          set -o pipefail
          RUSTFLAGS='-D warnings' cargo test --package st3215 --all-targets

      - name: Remove temporary machinery and commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/matdog/apply_rf_relative_span_repair.py
          rm -f .github/workflows/matdog-rf-relative-span-repair.yml
          git add \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            tools/matdog/apply_rf_relative_span_repair.py \
            .github/workflows/matdog-rf-relative-span-repair.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/matdog-rf-relative-span-repair.yml
            software/drivers/st3215/src/auto_calibrate/matdog.rs
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
            tools/matdog/apply_rf_relative_span_repair.py
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected[*]}"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(matdog): validate RF travel relative to LF V25 span'
          git push origin HEAD:matdog/rf-native-calibrator
