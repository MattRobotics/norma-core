name: MATDOG Materialize V28R Source Commit

on:
  push:
    branches:
      - matdog/lf-lower-m11-min-v28r-alignment

permissions:
  contents: write

concurrency:
  group: matdog-v28r-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Rust formatter
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Materialize validated source tree once
        shell: bash
        run: |
          set -euo pipefail
          marker=tools/matdog/materialized_v28r_source.env
          if [[ -f "$marker" ]]; then
            echo 'V28R source is already materialized; no branch write required.'
            exit 0
          fi

          source=software/drivers/st3215/src/auto_calibrate/matdog.rs
          tests=software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          port=software/drivers/st3215/src/port.rs
          ui=software/station/clients/station-viewer/src/pages/St3215BusCalibrationPage.tsx
          mkdir -p /tmp/matdog-v28r-tools

          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          parts=[]
          for index in range(4):
              parts.append(''.join(Path(f'tools/matdog/restart_safe_v11_bundle.part{index:02d}.b64').read_text().split()))
          text=''.join(parts)
          fixes=((3068,'U','c'),(len(parts[0])+len(parts[1])+3243,'a','i'))
          for offset, observed, expected in fixes:
              assert text[offset] == observed, (offset, text[offset], observed)
              text=text[:offset]+expected+text[offset+1:]
          Path('/tmp/restart_safe_v11_bundle.tar.gz').write_bytes(b64decode(text))
          PY
          echo 'dc424847dcc8c7e7ccf39c9b607b3d58d3efa3555996de67a06a2c3441b63118  /tmp/restart_safe_v11_bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/restart_safe_v11_bundle.tar.gz -C /tmp/matdog-v28r-tools

          python3 /tmp/matdog-v28r-tools/apply_restart_safe_v11.py "$source" "$tests" "$port"
          python3 tools/matdog/apply_motion_timeout_v13.py "$source" "$tests"
          python3 tools/matdog/apply_probe_home_tolerance_v18.py "$source" "$tests"
          python3 tools/matdog/apply_ordered_sequence_v20.py "$source" "$tests"
          python3 tools/matdog/fix_ordered_sequence_v20_quote.py "$source"
          python3 tools/matdog/clean_ordered_sequence_v20_warnings.py "$source"
          rustfmt --edition 2021 "$source" "$tests" "$port"
          git apply --check tools/matdog/v28r_alignment.patch
          git apply tools/matdog/v28r_alignment.patch
          rustfmt --edition 2021 "$source" "$tests" "$port"
          git diff --check

          cat > "$marker" <<EOF
          result=SOURCE_MATERIALIZED
          source_base=32e3222c87016b7f5d7c1c1da497a4cea3e7b80a
          ordered_v20_head=a87a8aecf0cc9a49c770bb213036a7670aa9a3a8
          local_validation_reference=5c52a93c2f889c556fb2f66cfce70f8843354f58
          hardware_started=false
          serial_opened=false
          EOF

          git add "$source" "$tests" "$port" "$ui" "$marker"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(matdog): materialize validated LF lower M11 MIN source chain'
          git push origin "HEAD:${GITHUB_REF_NAME}"
