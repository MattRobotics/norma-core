name: MATDOG LF LOWER M11 MIN V28R Source CI

on:
  push:
    branches:
      - matdog/lf-lower-m11-min-v28r-alignment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-v28r-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: 87 tests, viewer, Station, RAM-only audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: software/station/clients/station-viewer/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          npm install --global npm@11

      - name: Run independent V28R validation
        shell: bash
        run: bash tools/matdog/run_v28r_alignment_ci.sh

      - name: Upload V28R CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-lf-lower-m11-min-v28r-source-ci
          path: ci-output-v28r/
          if-no-files-found: error
