name: MATDOG Ordered UPPER LOWER HIP V20

on:
  push:
    branches:
      - matdog/ordered-upper-lower-hip-v20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-ordered-v20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Ordered profiles, zero warnings, full tests, Station build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact V20 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Install Station build dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Run reusable V20 validation
        shell: bash
        run: bash tools/matdog/run_ordered_v20_ci.sh

      - name: Upload V20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-ordered-upper-lower-hip-v20-evidence
          path: ci-output/
          if-no-files-found: error
