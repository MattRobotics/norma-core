name: MATDOG Ordered UPPER LOWER HIP V20

on:
  push:
    branches:
      - matdog/ordered-upper-lower-hip-v20
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-restart-safe-v11.yml"
      - "tools/matdog/restart_safe_v11_bundle.part*.b64"
      - "tools/matdog/apply_motion_timeout_v13.py"
      - "tools/matdog/apply_probe_home_tolerance_v18.py"
      - "tools/matdog/apply_ordered_sequence_v20.py"
      - "tools/matdog/fix_ordered_sequence_v20_quote.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-ordered-v20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Ordered profiles, early-stall gate, full tests, Station build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated V20 branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify canonical ancestry and exact branch scope
        shell: bash
        run: |
          set -euo pipefail
          base=32e3222c87016b7f5d7c1c1da497a4cea3e7b80a
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          expected=$'.github/workflows/matdog-restart-safe-v11.yml\ntools/matdog/apply_motion_timeout_v13.py\ntools/matdog/apply_ordered_sequence_v20.py\ntools/matdog/apply_probe_home_tolerance_v18.py\ntools/matdog/fix_ordered_sequence_v20_quote.py\ntools/matdog/restart_safe_v11_bundle.part00.b64\ntools/matdog/restart_safe_v11_bundle.part01.b64\ntools/matdog/restart_safe_v11_bundle.part02.b64\ntools/matdog/restart_safe_v11_bundle.part03.b64'
          printf 'head=%s\nchanged_files:\n%s\n' "$(git rev-parse HEAD)" "$actual"
          test "$actual" = "$expected"

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Install Station native build dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Decode immutable V11 bundle and compile transformers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output ci-tools
          python3 - <<'PY'
          from pathlib import Path
          fixes = (
              (Path('tools/matdog/restart_safe_v11_bundle.part00.b64'), 3068, 'U', 'c'),
              (Path('tools/matdog/restart_safe_v11_bundle.part02.b64'), 3243, 'a', 'i'),
          )
          for path, offset, observed, expected in fixes:
              text = ''.join(path.read_text().split())
              assert text[offset] == observed, (path, offset, text[offset], observed)
              path.write_text(text[:offset] + expected + text[offset + 1:])
          PY
          cat tools/matdog/restart_safe_v11_bundle.part*.b64 | base64 -d \
            > ci-output/restart_safe_v11_bundle.tar.gz
          echo 'dc424847dcc8c7e7ccf39c9b607b3d58d3efa3555996de67a06a2c3441b63118  ci-output/restart_safe_v11_bundle.tar.gz' \
            | sha256sum -c -
          tar -xzf ci-output/restart_safe_v11_bundle.tar.gz -C ci-tools
          python3 -m py_compile \
            ci-tools/apply_restart_safe_v11.py \
            ci-tools/audit_restart_safe_v11.py \
            ci-tools/replay_restart_safe_v11.py \
            tools/matdog/apply_motion_timeout_v13.py \
            tools/matdog/apply_probe_home_tolerance_v18.py \
            tools/matdog/apply_ordered_sequence_v20.py \
            tools/matdog/fix_ordered_sequence_v20_quote.py

      - name: Apply validated V11, V13, and V18 foundation
        shell: bash
        run: |
          set -o pipefail
          source=software/drivers/st3215/src/auto_calibrate/matdog.rs
          tests=software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          port=software/drivers/st3215/src/port.rs
          python3 ci-tools/apply_restart_safe_v11.py "$source" "$tests" "$port" \
            2>&1 | tee ci-output/apply-v11.log
          python3 tools/matdog/apply_motion_timeout_v13.py "$source" "$tests" \
            2>&1 | tee ci-output/apply-v13.log
          python3 tools/matdog/apply_probe_home_tolerance_v18.py "$source" "$tests" \
            2>&1 | tee ci-output/apply-v18.log

      - name: Apply ordered UPPER LOWER HIP V20
        shell: bash
        run: |
          set -o pipefail
          source=software/drivers/st3215/src/auto_calibrate/matdog.rs
          tests=software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          python3 tools/matdog/apply_ordered_sequence_v20.py "$source" "$tests" \
            2>&1 | tee ci-output/apply-v20.log
          python3 tools/matdog/fix_ordered_sequence_v20_quote.py "$source" \
            2>&1 | tee ci-output/fix-v20-quote.log
          grep -q 'const UPPER_85_DELTA: i16 = 967;' "$source"
          grep -q 'const LOWER_FOLDED_DELTA: i16 = -990;' "$source"
          grep -q 'ContactState::EarlyStall' "$source"
          grep -q 'HIP hardware is blocked until ordered UPPER MIN/MAX and LOWER MIN/MAX phase proof is verified' "$source"
          if grep -Fq '\"HIP hardware is blocked' "$source"; then
            echo 'escaped Rust quote remained after normalization' >&2
            exit 1
          fi

      - name: Restart-safe audit, rustfmt, and changed-source scope
        shell: bash
        run: |
          set -euo pipefail
          source=software/drivers/st3215/src/auto_calibrate/matdog.rs
          tests=software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          port=software/drivers/st3215/src/port.rs
          python3 ci-tools/audit_restart_safe_v11.py "$source" "$tests" "$port" \
            | tee ci-output/restart-safe-audit.log
          rustfmt --edition 2021 "$source" "$tests" "$port"
          git diff --check
          actual="$(git diff --name-only | grep '^software/' | sort)"
          expected=$'software/drivers/st3215/src/auto_calibrate/matdog.rs\nsoftware/drivers/st3215/src/auto_calibrate/matdog_test.rs\nsoftware/drivers/st3215/src/port.rs'
          test "$actual" = "$expected"

      - name: Enforce ordered RAM-only safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ci-output/ordered-contract.log
          from pathlib import Path
          source = Path('software/drivers/st3215/src/auto_calibrate/matdog.rs').read_text()
          tests = Path('software/drivers/st3215/src/auto_calibrate/matdog_test.rs').read_text()
          forbidden = (
              'EepromRegister', 'RamRegister::Lock', 'reg_write: Some',
              'reset: Some', 'reset_calibration: Some',
              'freeze_calibration: Some', 'action: Some', 'Offset.address',
          )
          required = (
              'Inspect restart-safe profile entry',
              'motion_timeout_for_distance',
              'const PROBE_HOME_TOLERANCE_TICKS: u16 = 16;',
              'for joint in [JointKind::Upper, JointKind::Lower, JointKind::Hip]',
              'const UPPER_85_DELTA: i16 = 967;',
              'const LOWER_FOLDED_DELTA: i16 = -990;',
              'contact_acceptance_bounds',
              'ContactState::EarlyStall',
              'early stall outside model contact corridor',
              'HIP_HARDWARE_BLOCK_REASON',
              'global_torque_off_verified',
          )
          found = [token for token in forbidden if token in source]
          missing = [token for token in required if token not in source]
          test_required = (
              'ordered_profile_table_lists_upper_then_lower_then_hip',
              'lf_lower_profiles_use_horizontal_upper_and_exact_unsigned_numbers',
              'hip_prerequisites_are_compact_and_side_specific',
              'isolated_hip_hardware_profiles_are_blocked_but_lower_is_allowed',
              'v19_m13_2405_is_early_stall_not_contact',
          )
          missing_tests = [token for token in test_required if token not in tests]
          if source.count('PROBE_HOME_TOLERANCE_TICKS') != 4:
              raise SystemExit('probe-home tolerance scope changed')
          if found or missing or missing_tests:
              raise SystemExit(
                  f'forbidden={found} missing={missing} missing_tests={missing_tests}'
              )
          print('ordered RAM-only contract: PASS')
          PY

      - name: Targeted V20 regressions
        shell: bash
        run: |
          set -o pipefail
          log=ci-output/targeted-v20.log
          cargo test --package st3215 ordered_profile_table_ -- --nocapture 2>&1 | tee "$log"
          cargo test --package st3215 lf_lower_profiles_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 hip_prerequisites_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 isolated_hip_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 contact_acceptance_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 v19_m13_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 detector_confirms_only_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 startup_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 motion_timeout_ -- --nocapture 2>&1 | tee -a "$log"
          cargo test --package st3215 probe_home_tolerance_ -- --nocapture 2>&1 | tee -a "$log"
          for token in \
            'ordered_profile_table_lists_upper_then_lower_then_hip ... ok' \
            'lf_lower_profiles_use_horizontal_upper_and_exact_unsigned_numbers ... ok' \
            'hip_prerequisites_are_compact_and_side_specific ... ok' \
            'isolated_hip_hardware_profiles_are_blocked_but_lower_is_allowed ... ok' \
            'contact_acceptance_corridors_match_model_inner_boundary_and_guard ... ok' \
            'v19_m13_2405_is_early_stall_not_contact ... ok' \
            'detector_confirms_only_persistent_stall_inside_profile_corridor ... ok'; do
            grep -q "$token" "$log"
          done

      - name: Full ST3215 suite
        shell: bash
        run: |
          set -o pipefail
          cargo test --package st3215 2>&1 | tee ci-output/st3215-full-tests.log
          grep -q '85 passed; 0 failed' ci-output/st3215-full-tests.log
          if grep -q '^warning:' ci-output/st3215-full-tests.log; then
            echo 'Rust warnings detected in V20 tests' >&2
            exit 1
          fi

      - name: Deterministic restart-state replay
        run: python3 ci-tools/replay_restart_safe_v11.py | tee ci-output/restart-safe-replay.log

      - name: Create CI-only Station viewer stub
        shell: bash
        run: |
          set -euo pipefail
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG ordered V20 build gate</title>\n' > "$asset"

      - name: Station release build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --package station 2>&1 | tee ci-output/station-build.log
          strings target/release/station | grep -F 'Inspect restart-safe profile entry'
          strings target/release/station | grep -F 'early stall outside model contact corridor'
          strings target/release/station | grep -F 'HIP hardware is blocked until ordered UPPER MIN/MAX and LOWER MIN/MAX phase proof is verified'
          if grep -q '^warning:' ci-output/station-build.log; then
            echo 'Rust warnings detected in V20 Station build' >&2
            exit 1
          fi

      - name: Remove CI-only viewer stub
        if: always()
        run: rm -rf software/station/clients/station-viewer/dist

      - name: Upload V20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-ordered-upper-lower-hip-v20-evidence
          path: ci-output/
          if-no-files-found: error
