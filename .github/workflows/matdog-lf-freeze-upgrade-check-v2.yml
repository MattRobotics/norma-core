name: MATDOG LF Freeze Upgrade Check V2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/matdog-lf-freeze-upgrade-check-v2.yml"
      - "tools/matdog/apply_lf_freeze_source_upgrade.py"
      - "tools/matdog/fix_lf_upgrade_transformer_v2.py"
      - "tools/matdog/fix_lf_upgrade_transformer_v3.py"
      - "tools/matdog/matdog_lf_profile.py"
      - "tools/matdog/test_matdog_lf_profile.py"
      - "software/drivers/st3215/src/bin/matdog_lf_freeze.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-lf-freeze-upgrade-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transformed-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Apply exact source transformation
        run: |
          set -euo pipefail
          python3 tools/matdog/fix_lf_upgrade_transformer_v2.py
          python3 tools/matdog/fix_lf_upgrade_transformer_v3.py
          python3 tools/matdog/apply_lf_freeze_source_upgrade.py --apply
          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs
          git diff --check
          git diff --binary > matdog-lf-freeze-upgrade.patch
      - name: Architecture gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          port = Path("software/drivers/st3215/src/port.rs").read_text()
          matdog = Path("software/drivers/st3215/src/auto_calibrate/matdog.rs").read_text()
          runner = Path("tools/matdog/matdog_headless_auto_calibrate.py").read_text()
          provisioner = Path("software/drivers/st3215/src/bin/matdog_lf_freeze.rs").read_text()
          combined = port + matdog + runner + provisioner
          forbidden = (
              "MATDOG_MAX_TRANSIENTS_PER_MOTOR",
              "MATDOG_MAX_TRANSIENTS_TOTAL",
              "MATDOG_IMMEDIATE_THERMAL_ABORT_C",
              "confirmed_or_budget_exhausted",
              "classify_matdog_temperature_sample",
          )
          required = (
              "read_motor_temperature_direct",
              "MATDOG_THERMAL_SAMPLE_PERIOD",
              "classify_matdog_direct_temperature_samples(70, &[85, 84, 39])",
              "MATDOG LF URDF FREEZE GATE: PASS",
              "MATDOG_LF_PROFILE_V1|joint=",
              "hip_staged_q0",
              "lower_staged_q0",
              "upper_staged_q0",
              "class LatestOnlyQueue",
              "--preflight-frames must be at least 10",
              "default=10",
              "default=1.0",
              "m11_last_recorded_stamp_ns",
              "LF_FREEZE_COMMIT",
              "rollback",
          )
          found = [token for token in forbidden if token in combined]
          missing = [token for token in required if token not in combined]
          if found or missing:
              raise SystemExit(f"found={found}; missing={missing}")
          print("MATDOG LF freeze architecture gate: PASS")
          PY
      - name: Rust format
        run: |
          rustfmt --edition 2021 --check --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs
      - name: Rust tests
        run: cargo test --package st3215 --all-targets
      - name: Python tests
        run: |
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_lf_profile
      - name: Station viewer stub
        run: |
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG LF freeze upgrade</title>\n' > "$asset"
      - name: Release builds
        run: |
          cargo build --release --package station
          cargo build --release --package st3215 --bin matdog_lf_freeze
      - if: always()
        run: rm -rf software/station/clients/station-viewer/dist
      - name: Package transformed deliverable
        if: success()
        run: |
          mkdir -p lf-freeze-deliverable/source lf-freeze-deliverable/bin
          cp matdog-lf-freeze-upgrade.patch lf-freeze-deliverable/
          cp software/drivers/st3215/src/port.rs lf-freeze-deliverable/source/
          cp software/drivers/st3215/src/auto_calibrate/matdog.rs lf-freeze-deliverable/source/
          cp software/drivers/st3215/src/auto_calibrate/matdog_test.rs lf-freeze-deliverable/source/
          cp tools/matdog/matdog_headless_auto_calibrate.py lf-freeze-deliverable/source/
          cp .github/workflows/matdog-native-calibrator-check.yml lf-freeze-deliverable/source/
          cp target/release/station lf-freeze-deliverable/bin/
          cp target/release/matdog_lf_freeze lf-freeze-deliverable/bin/
          sha256sum lf-freeze-deliverable/bin/* > lf-freeze-deliverable/SHA256SUMS
          git rev-parse HEAD > lf-freeze-deliverable/base-head.txt
      - name: Upload transformed deliverable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-lf-freeze-upgrade-deliverable-v2
          path: lf-freeze-deliverable/
          if-no-files-found: error
