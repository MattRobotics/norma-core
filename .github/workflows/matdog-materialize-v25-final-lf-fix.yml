name: MATDOG Materialize V25 Final LF Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]

permissions:
  contents: write

concurrency:
  group: matdog-materialize-v25-final-lf-fix
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'matdog/lf-q0-contract-v42'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: matdog/lf-q0-contract-v42
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed V25 correction
        run: python3 tools/matdog/materialize_v25_final_lf_fix.py

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.3'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Format exact changed files
        run: |
          rustfmt --edition 2021 \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          rustfmt --edition 2021 --check \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          python3 -m py_compile \
            tools/matdog/matdog_lf_profile.py \
            tools/matdog/test_matdog_lf_profile.py
          git diff --check

      - name: Run complete ST3215 suite
        run: cargo test --package st3215

      - name: Run MATDOG Python contracts
        run: |
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_native_observer_contract \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_v42_pinned_launcher

      - name: Commit and publish reviewed V25 files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            tools/matdog/matdog_lf_profile.py \
            tools/matdog/test_matdog_lf_profile.py
          if git diff --cached --quiet; then
            echo "V25 correction already materialized."
            exit 0
          fi
          git commit -m "fix(matdog): complete LF contact sequence with bounded evidence gates"
          git fetch origin matdog/lf-q0-contract-v42
          git rebase origin/matdog/lf-q0-contract-v42
          git push origin HEAD:matdog/lf-q0-contract-v42
