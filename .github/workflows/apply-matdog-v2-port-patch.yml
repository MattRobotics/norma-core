name: Apply MATDOG 24-contact patch

on:
  push:
    branches:
      - matdog/native-calibrator-24-contact-profiles
    paths:
      - ".github/workflows/apply-matdog-v2-port-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: matdog/native-calibrator-24-contact-profiles
          fetch-depth: 0

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.matdog-v2-payload/part-* | tr -d '\n' | base64 --decode > /tmp/apply_matdog_v2.py
          python3 /tmp/apply_matdog_v2.py

      - name: Setup Rust formatter
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Format and validate patch
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/mod.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_v2.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_v2_test.rs
          git diff --check

      - name: Remove one-shot transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/.matdog-v2-payload
          rm -f .github/workflows/apply-matdog-v2-port-patch.yml

      - name: Commit applied source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(st3215): generalize MATDOG calibrator profiles"
          git push origin HEAD:matdog/native-calibrator-24-contact-profiles
