name: Final Repository Cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: final-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'MattRobotics/norma-core'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Close every remaining open PR except self-removal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].number' | while read -r pr; do
              [ -n "$pr" ] || continue
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=closed >/dev/null
            done

      - name: Delete all noncanonical branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | while read -r branch; do
              case "$branch" in
                main|release/matdog-lf-calibrator-v25) continue ;;
              esac
              encoded="${branch//\//%2F}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" || true
            done

      - name: Delete failed, cancelled, skipped, stale and non-started runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="${GITHUB_RUN_ID}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.name,.status,(.conclusion // ""),(.head_branch // "")] | @tsv' \
          | while IFS=$'\t' read -r id name status conclusion head_branch; do
              [ "$id" = "$current" ] && continue

              delete=false
              case "$conclusion" in
                failure|cancelled|skipped|stale|action_required|startup_failure|timed_out|neutral) delete=true ;;
              esac

              case "$name" in
                *"RF"*Repair*|*"RF"*Publisher*|*"Span"*Repair*|*"Guard"*Repair*) delete=true ;;
              esac

              case "$head_branch" in
                tmp/*|matdog/rf-native-calibrator|archive/rf-calibrator-handoff|maintenance/final-repository-cleanup) delete=true ;;
              esac

              if [ "$status" != "completed" ] && [ "$delete" = true ]; then
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
                for _ in $(seq 1 20); do
                  state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '.status' 2>/dev/null || true)"
                  [ "$state" = "completed" ] && break
                  sleep 1
                done
              fi

              if [ "$delete" = true ]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1 || true
              fi
            done

      - name: Remove this workflow from main through a protected-branch PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="maintenance/remove-final-repository-cleanup"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git rm .github/workflows/final-repository-cleanup.yml
          git commit -m 'ci: remove completed final repository cleanup'
          git push origin HEAD:"$branch"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title 'ci: remove completed final repository cleanup' \
            --body 'Removes the one-shot cleanup workflow after it closes experimental PRs, deletes noncanonical branches and removes failed/non-started Actions runs.')"
          gh pr merge "$pr_url" --squash --admin --delete-branch

      - name: Final branch and PR verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | sort > /tmp/branches.txt
          printf 'main\nrelease/matdog-lf-calibrator-v25\n' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/branches.txt

          open_prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length' | awk '{s+=$1} END{print s+0}')"
          test "$open_prs" -eq 0

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/matdog-lf-calibrator-v25" --jq '.object.sha')" = \
            'f87dd1fbc7e8100d275c74f9af448642f3429680'
