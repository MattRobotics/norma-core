name: MATDOG RF Apply Development Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-rf-apply-development-patch.yml"
      - "tools/matdog/.rf-patch/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matdog-rf-apply-development-patch
  cancel-in-progress: true

jobs:
  apply-reviewed-patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'matdog/rf-native-calibrator'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RF branch
        uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0

      - name: Apply complete reviewed code patch once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "matdog/rf-native-calibrator"
          payload=tools/matdog/.rf-patch
          required=(chunk-00 chunk-01 chunk-02 chunk-03)
          for name in "${required[@]}"; do
            test -f "$payload/$name"
          done
          cat "$payload"/chunk-* | base64 --decode | gzip --decompress > /tmp/matdog-rf.patch
          echo "9734081d67d49c40f0acefd8f740d6bb8a109dbd59f6e25a70ada4c2adad3c88  /tmp/matdog-rf.patch" | sha256sum --check
          git apply --check /tmp/matdog-rf.patch
          git apply /tmp/matdog-rf.patch
          git checkout -- \
            .github/workflows/matdog-native-calibrator-check.yml \
            .github/workflows/matdog-rf-development-gate.yml
          rm -rf "$payload"
          git config user.name "MattRobotics RF CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only | grep -v '^\.github/workflows/'
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m "feat(matdog): add data-driven RF native calibrator"
          git push origin HEAD:matdog/rf-native-calibrator
