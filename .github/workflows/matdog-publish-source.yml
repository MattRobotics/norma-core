name: MATDOG Publish Verified Source

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-publish-source.yml"
      - "tools/matdog_publish_verified_source.sh"

permissions:
  contents: write
  actions: read

concurrency:
  group: matdog-publish-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Publish source only after repeated verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/matdog_publish_verified_source.sh

      - name: Upload source publication logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-publish-source-logs
          path: ${{ runner.temp }}/matdog-publish-source-logs/
          if-no-files-found: warn
