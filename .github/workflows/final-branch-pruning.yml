name: Final Branch Pruning

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'MattRobotics/norma-core'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove every noncanonical branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | while read -r branch; do
              case "$branch" in
                main|release/matdog-lf-calibrator-v25) continue ;;
              esac
              encoded="${branch//\//%2F}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" >/dev/null 2>&1 || true
            done

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/matdog-lf-calibrator-v25" --jq '.object.sha')" = \
            'f87dd1fbc7e8100d275c74f9af448642f3429680'
