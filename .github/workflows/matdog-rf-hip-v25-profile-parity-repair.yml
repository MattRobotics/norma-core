name: MATDOG RF HIP V25 Profile Parity Repair

on:
  push:
    branches:
      - matdog/rf-native-calibrator
    paths:
      - ".github/workflows/matdog-rf-hip-v25-profile-parity-repair.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RF milestone branch
        uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Apply only exact V25 HIP sequence parity
        run: python3 tools/matdog/apply_rf_hip_v25_profile_parity.py

      - name: Prove unchanged operational constants and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('software/drivers/st3215/src/auto_calibrate/matdog.rs').read_text()
          required = (
              'const STATIC_TOLERANCE_TICKS: u16 = 10;',
              'const PROBE_HOME_TOLERANCE_TICKS: u16 = 16;',
              'const TORQUE_LIMIT: u16 = 500;',
              'const GOAL_SPEED: u16 = 160;',
              'const ACCELERATION: u8 = 8;',
              'const COARSE_STEP_TICKS: u16 = 64;',
              'const FINE_STEP_TICKS: u16 = 8;',
              'const LOWER_FOLDED_DELTA: i16 = -990;',
              'full_sequence_hip_profile_pair(leg)',
              'RF_HIP_SEQUENCE_ARM_VALUE',
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'missing V25 contract tokens: {missing}')
          print('V25 constants and HIP profile parity: PASS')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = $'software/drivers/st3215/src/auto_calibrate/matdog.rs\nsoftware/drivers/st3215/src/auto_calibrate/matdog_test.rs'

      - name: Format and warning-free regressions
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          RUSTFLAGS='-D warnings' cargo test --package st3215 --all-targets
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test

      - name: Commit only source and tests to RF branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          git diff --cached --quiet && { echo 'no source change'; exit 1; }
          git commit -m 'fix(matdog): restore exact V25 HIP sequence parity for RF'
          git push origin HEAD:matdog/rf-native-calibrator
