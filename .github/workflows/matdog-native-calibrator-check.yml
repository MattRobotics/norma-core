name: MATDOG Native Calibrator Offline Check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - ".github/workflows/matdog-native-observer-check.yml"
      - "protobufs/drivers/st3215/**"
      - "software/drivers/st3215/**"
      - "software/station/bin/station/**"
      - "tools/matdog/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-native-calibrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-rf-package:
    name: V25 LF regression and RF package certification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove clean repository and absence of temporary tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e .github/workflows/matdog-rf-canonical-guard-repair.yml
          test ! -e .github/workflows/matdog-rf-repair-target.yml
          test ! -e tools/matdog/.rf-canonical-guard-repair-trigger
          test ! -e tools/matdog/apply_rf_canonical_guard_repair.py
          mkdir -p ci-output package/MATDOG_RF_V25_HARDWARE_PACKAGE/bin
          git rev-parse HEAD | tee ci-output/HEAD.txt

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy

      - name: Install Station native dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Enforce canonical V25 authority and temperature boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo 'b9521f97ed0a3cf4d7f39d8712c2fb7a060fa56bbbc2a10b8709742d6b0a5167  tools/matdog/matdog_native_observer_contract.py' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path

          observer = Path('tools/matdog/matdog_native_observer_contract.py').read_text()
          launcher = Path('tools/matdog/matdog_v42_pinned_launcher.py').read_text()
          rust = Path('software/drivers/st3215/src/auto_calibrate/matdog.rs').read_text()
          tests = Path('software/drivers/st3215/src/auto_calibrate/matdog_test.rs').read_text()
          port = Path('software/drivers/st3215/src/port.rs').read_text()
          runner_tests = Path('tools/matdog/test_matdog_headless_auto_calibrate.py').read_text()

          required = (
              '_matdog_native_authority_observer = True',
              'matdog_native_observer_contract.install(runner)',
              'RF_FULL_SEQUENCE_ARM_VALUE',
              'Self::Rf => Some(Self::Rh)',
              'measure_lf_joint_pair_efficient(',
              'global_torque_off_verified()',
              'persistent_freeze_authorized=false',
              'fn next_guard_bounded_target(',
              'rf_m22_real_trace_confirms_contact_at_the_existing_guard_without_widening_it',
              'lf_m12_mirror_uses_the_same_existing_guard_rule',
              'MATDOG_THERMAL_CONFIRMATION_READS: usize = 3',
              'over_limit >= 2',
              'matdog_direct_temperature_never_converts_repeated_false_spikes_to_heat',
              'superseded_bulk_temperature_is_replaced_by_confirmed_latest',
          )
          combined = observer + launcher + rust + tests + port + runner_tests
          missing = [token for token in required if token not in combined]

          forbidden_observer = (
              'M32', 'M42', 'HOME_TICK', 'current_step',
              'calibration.phase', 'CONTROLLED_GOAL_CORRIDORS',
              'CONTROLLED_POSITION_CORRIDORS', 'NONPARTICIPATING_MOTOR_IDS',
          )
          conflicts = [token for token in forbidden_observer if token in observer]
          if missing or conflicts:
              raise SystemExit(f'missing={missing}; observer_conflicts={conflicts}')
          print('canonical V25 authority, guard and temperature contracts: PASS')
          PY

      - name: Warning-free Rust formatting and complete tests
        shell: bash
        run: |
          set -o pipefail
          rustfmt --edition 2021 --check --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/mod.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs \
            2>&1 | tee ci-output/rustfmt.log
          RUSTFLAGS='-D warnings' cargo test --package st3215 --all-targets \
            2>&1 | tee ci-output/st3215-tests.log

      - name: LF/RF runner, observer and launcher regressions
        shell: bash
        run: |
          set -o pipefail
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_native_observer_contract \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_v42_pinned_launcher \
            2>&1 | tee ci-output/python-tests.log

      - name: Build warning-free Station release
        shell: bash
        run: |
          set -o pipefail
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG RF certified build</title>\n' > "$asset"
          RUSTFLAGS='-D warnings' cargo build --release --package station \
            2>&1 | tee ci-output/station-build.log
          ! grep -E '^warning:' ci-output/station-build.log
          cp target/release/station package/MATDOG_RF_V25_HARDWARE_PACKAGE/bin/station
          chmod 755 package/MATDOG_RF_V25_HARDWARE_PACKAGE/bin/station
          sha256sum package/MATDOG_RF_V25_HARDWARE_PACKAGE/bin/station \
            | tee ci-output/station-release.sha256
          target/release/station --version | tee ci-output/station-version.txt
          rm -rf software/station/clients/station-viewer/dist

      - name: Build one-command hardware package using historical launcher
        shell: bash
        env:
          CERTIFIED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ROOT=package/MATDOG_RF_V25_HARDWARE_PACKAGE
          STATION_SHA="$(sha256sum "$ROOT/bin/station" | awk '{print $1}')"
          RUNNER_SHA="$(sha256sum tools/matdog/matdog_headless_auto_calibrate.py | awk '{print $1}')"
          OBSERVER_SHA="$(sha256sum tools/matdog/matdog_native_observer_contract.py | awk '{print $1}')"
          LAUNCHER_SHA="$(sha256sum tools/matdog/matdog_v42_pinned_launcher.py | awk '{print $1}')"

          cat > "$ROOT/manifest.json" <<JSON
          {
            "schema": "matdog.rf.v25-hardware-package.v2",
            "certified_commit": "$CERTIFIED_COMMIT",
            "station_sha256": "$STATION_SHA",
            "runner_sha256": "$RUNNER_SHA",
            "observer_sha256": "$OBSERVER_SHA",
            "launcher_sha256": "$LAUNCHER_SHA",
            "observer_v25_sha256": "b9521f97ed0a3cf4d7f39d8712c2fb7a060fa56bbbc2a10b8709742d6b0a5167",
            "leg": "RF",
            "arm_value": "RF_LEG_STATE_MACHINE",
            "total_steps": 58,
            "persistent_freeze_authorized": false
          }
          JSON

          cat > "$ROOT/run_matdog_rf_v25.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          PACKAGE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          REPO="${MATDOG_REPO:-/home/matteo-manicardi/norma-core}"
          BRANCH="matdog/rf-native-calibrator"
          SERVER="127.0.0.1:8888"
          BUS_SERIAL="5B14114953"
          CONFIG="$REPO/software/station/bin/station/station.yaml"
          STATION="$PACKAGE_DIR/bin/station"
          MANIFEST="$PACKAGE_DIR/manifest.json"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="/home/matteo-manicardi/MATDOG/_archive/MATDOG_RF_V25_CERTIFIED_${STAMP}"
          STATION_PID=""

          block() { printf 'BLOCKED  %s\n' "$*" >&2; exit 2; }
          pass() { printf 'PASS     %s\n' "$*"; }
          cleanup() {
            local rc=$?
            set +e
            if [[ -n "${STATION_PID:-}" ]] && kill -0 "$STATION_PID" 2>/dev/null; then
              kill -INT "$STATION_PID" 2>/dev/null
              for _ in $(seq 1 120); do
                kill -0 "$STATION_PID" 2>/dev/null || break
                sleep 0.25
              done
              kill -0 "$STATION_PID" 2>/dev/null && kill -KILL "$STATION_PID" 2>/dev/null
              wait "$STATION_PID" 2>/dev/null
            fi
            exit "$rc"
          }
          trap cleanup EXIT INT TERM

          [[ -d "$REPO/.git" ]] || block "repository missing: $REPO"
          [[ -f "$MANIFEST" && -x "$STATION" ]] || block "package incomplete"
          mapfile -t META < <(python3 - "$MANIFEST" <<'PY'
          import json, sys
          m=json.load(open(sys.argv[1], encoding='utf-8'))
          assert m['schema']=='matdog.rf.v25-hardware-package.v2'
          assert m['leg']=='RF' and m['arm_value']=='RF_LEG_STATE_MACHINE'
          assert m['total_steps']==58 and m['persistent_freeze_authorized'] is False
          for key in ('certified_commit','station_sha256','runner_sha256','observer_sha256','launcher_sha256'):
              print(m[key])
          PY
          )
          COMMIT="${META[0]}"; STATION_SHA="${META[1]}"; RUNNER_SHA="${META[2]}"
          OBSERVER_SHA="${META[3]}"; LAUNCHER_SHA="${META[4]}"

          cd "$REPO"
          [[ "$(sha256sum "$STATION" | awk '{print $1}')" == "$STATION_SHA" ]] || block "Station SHA mismatch"
          [[ "$(sha256sum tools/matdog/matdog_headless_auto_calibrate.py | awk '{print $1}')" == "$RUNNER_SHA" ]] || block "runner SHA mismatch"
          [[ "$(sha256sum tools/matdog/matdog_native_observer_contract.py | awk '{print $1}')" == "$OBSERVER_SHA" ]] || block "observer SHA mismatch"
          [[ "$OBSERVER_SHA" == 'b9521f97ed0a3cf4d7f39d8712c2fb7a060fa56bbbc2a10b8709742d6b0a5167' ]] || block "observer is not canonical V25"
          [[ "$(sha256sum tools/matdog/matdog_v42_pinned_launcher.py | awk '{print $1}')" == "$LAUNCHER_SHA" ]] || block "historical launcher SHA mismatch"

          if [[ "${1:-}" == '--self-test' ]]; then
            python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
            python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test
            printf 'PACKAGE_SELF_TEST=PASS\n'
            trap - EXIT INT TERM
            exit 0
          fi

          git fetch origin "$BRANCH"
          [[ "$(git branch --show-current)" == "$BRANCH" ]] || block "active branch is not $BRANCH"
          git merge --ff-only "origin/$BRANCH"
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]] || block "HEAD is not certified commit $COMMIT"
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || block "working tree is not clean"
          [[ -f "$CONFIG" ]] || block "Station configuration missing"
          pgrep -af '(^|/)(station)( |$)' >/dev/null && block "Station is already running"
          shopt -s nullglob; SERIALS=(/dev/serial/by-id/* /dev/ttyACM* /dev/ttyUSB*); shopt -u nullglob
          for dev in "${SERIALS[@]}"; do
            command -v lsof >/dev/null 2>&1 && lsof "$dev" >/dev/null 2>&1 && block "serial already owned: $dev"
            command -v fuser >/dev/null 2>&1 && fuser "$dev" >/dev/null 2>&1 && block "serial already owned: $dev"
          done

          mkdir -p "$OUT/station-data" "$OUT/runner"
          MATDOG_NATIVE_CALIBRATOR_ARM=RF_LEG_STATE_MACHINE RUST_LOG="${RUST_LOG:-info}" \
          "$STATION" --config "$CONFIG" --tcp "$SERVER" --normfs-base-folder "$OUT/station-data" \
            > "$OUT/station.log" 2>&1 &
          STATION_PID=$!
          python3 - "$SERVER" "$STATION_PID" <<'PY'
          import os,socket,sys,time
          host,port=sys.argv[1].rsplit(':',1); pid=int(sys.argv[2]); deadline=time.monotonic()+30
          while time.monotonic()<deadline:
              try: os.kill(pid,0)
              except ProcessLookupError: raise SystemExit('Station exited before readiness')
              try:
                  with socket.create_connection((host,int(port)),timeout=.5): raise SystemExit(0)
              except OSError: time.sleep(.25)
          raise SystemExit('Station readiness timeout')
          PY
          sleep 10
          kill -0 "$STATION_PID" 2>/dev/null || block "Station exited during discovery"

          set +e
          python3 tools/matdog/matdog_v42_pinned_launcher.py \
            --leg RF --server "$SERVER" --bus-serial "$BUS_SERIAL" \
            --station-pid "$STATION_PID" --expected-station-sha256 "$STATION_SHA" \
            --output-dir "$OUT/runner" 2>&1 | tee "$OUT/runner-console.log"
          RC=${PIPESTATUS[0]}
          set -e
          for _ in $(seq 1 120); do kill -0 "$STATION_PID" 2>/dev/null || break; sleep .25; done
          kill -0 "$STATION_PID" 2>/dev/null && block "Station still running after launcher"
          STATION_PID=""
          [[ "$RC" -eq 0 ]] || block "RF launcher exit code $RC"

          REPORT="$OUT/runner/headless-report.json"
          [[ -f "$REPORT" ]] || block "hardware report missing"
          python3 - "$REPORT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); t=r.get('terminal') or {}; s=r.get('station_shutdown') or {}
          assert r.get('result')=='PASS',r.get('faults')
          assert r.get('schema')=='matdog.rf.headless_auto_calibrate.v1'
          assert r.get('global_torque_off_verified') is True
          assert r.get('eeprom_writes_sent') is False and r.get('register_writes_sent_by_runner') is False
          assert (t.get('current_step'),t.get('total_steps'),t.get('phase'))==(58,58,'RF_LEG_STATE_MACHINE: completed')
          assert s.get('stopped') is True
          PY
          sha256sum "$REPORT" "$OUT/station.log" "$OUT/runner-console.log" > "$OUT/SHA256SUMS.txt"
          printf 'REPORT=%s\nEVIDENCE=%s\nFINAL=PASS\n' "$REPORT" "$OUT"
          trap - EXIT INT TERM
          SCRIPT
          chmod 755 "$ROOT/run_matdog_rf_v25.sh"

          MATDOG_REPO="$GITHUB_WORKSPACE" bash "$ROOT/run_matdog_rf_v25.sh" --self-test
          tar -C package -czf MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz MATDOG_RF_V25_HARDWARE_PACKAGE
          sha256sum MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz > MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz.sha256
          sha256sum -c MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz.sha256
          cp MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz* ci-output/

      - name: Upload certified two-file package
        uses: actions/upload-artifact@v4
        with:
          name: MATDOG_RF_V25_CERTIFIED_TWO_FILES
          path: |
            MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz
            MATDOG_RF_V25_HARDWARE_PACKAGE.tar.gz.sha256
          if-no-files-found: error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MATDOG_RF_V25_VERIFICATION_EVIDENCE
          path: ci-output/
          if-no-files-found: error
