name: MATDOG Payload Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - "tools/.matdog-v2-payload/**"

permissions:
  contents: read

jobs:
  payload-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Collect payload diagnostics
        shell: bash
        run: |
          mkdir -p payload-diagnostic
          set +e
          {
            echo "=== PART SIZES AND HASHES ==="
            wc -c tools/.matdog-v2-payload/part-*
            sha256sum tools/.matdog-v2-payload/part-*
            echo "=== COMBINED PAYLOAD ==="
            cat tools/.matdog-v2-payload/part-* | tr -d '\n' > /tmp/apply_matdog_v2.py.b64
            wc -c /tmp/apply_matdog_v2.py.b64
            sha256sum /tmp/apply_matdog_v2.py.b64
            echo "=== BASE64 DECODE ==="
            base64 --decode /tmp/apply_matdog_v2.py.b64 > /tmp/apply_matdog_v2.py
            echo "decode_status=$?"
            wc -c /tmp/apply_matdog_v2.py
            sha256sum /tmp/apply_matdog_v2.py
            echo "=== APPLY SCRIPT ==="
            python3 /tmp/apply_matdog_v2.py
            echo "apply_status=$?"
          } > payload-diagnostic/output.txt 2>&1
          echo "diagnostic_complete" > payload-diagnostic/status.txt
          exit 0

      - name: Upload payload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: matdog-payload-diagnostic
          path: payload-diagnostic/
          if-no-files-found: error
