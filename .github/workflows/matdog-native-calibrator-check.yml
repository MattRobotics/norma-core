name: MATDOG RF Exact V25 Port Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - "software/drivers/st3215/**"

permissions:
  contents: write

concurrency:
  group: matdog-rf-exact-v25-port-repair
  cancel-in-progress: false

jobs:
  repair-and-prove:
    if: github.head_ref == 'matdog/rf-native-calibrator'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Apply exact V25 data-port repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          rust_path = Path("software/drivers/st3215/src/auto_calibrate/matdog.rs")
          tests_path = Path("software/drivers/st3215/src/auto_calibrate/matdog_test.rs")
          rust = rust_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"        let low = HOME_TICK\n"
              r"            \.min\(parking\.target_tick\)\n"
              r"            \.saturating_sub\(STATIC_TOLERANCE_TICKS\);\n"
              r"        let high = HOME_TICK\n"
              r"            \.max\(parking\.target_tick\)\n"
              r"            \.min\(protocol::MAX_ANGLE_STEP\);\n"
              r"        return \(low\.\.=high\)\.contains\(&target\);"
          )
          replacement = '''        let (low, high) = if parking.target_tick >= HOME_TICK {
              (
                  HOME_TICK.saturating_sub(STATIC_TOLERANCE_TICKS),
                  parking.target_tick,
              )
          } else {
              (
                  parking.target_tick,
                  HOME_TICK
                      .saturating_add(STATIC_TOLERANCE_TICKS)
                      .min(protocol::MAX_ANGLE_STEP),
              )
          };
          return (low..=high).contains(&target);'''
          rust, count = pattern.subn(replacement, rust, count=1)
          if count != 1 and replacement not in rust:
              raise SystemExit(f"parking goal gate matches={count}, expected 1")

          dead = [
              r"#\[cfg\(test\)\]\nfn lf_full_joint_corridor\(motor_id: u8\) -> Option<TickCorridor> \{\n    full_joint_corridor\(Leg::Lf, motor_id\)\n\}\n\n",
              r"#\[cfg\(test\)\]\nfn lf_parking_corridor\(\) -> Result<TickCorridor, String> \{\n    parking_corridor\(Leg::Lf\)\n\}\n\n",
              r"#\[cfg\(test\)\]\nfn lf_participant_corridor\(motor_id: u8\) -> Result<TickCorridor, String> \{\n    participant_corridor\(Leg::Lf, motor_id\)\n\}\n\n",
              r"#\[cfg\(test\)\]\nfn lf_machine_profile_record\(evidence: JointCalibrationEvidence\) -> String \{\n    leg_machine_profile_record\(Leg::Lf, evidence\)\n\}\n\n",
              r"#\[cfg\(test\)\]\nfn joint_degree_evidence\(evidence: JointCalibrationEvidence\) -> String \{\n    leg_degree_evidence\(Leg::Lf, evidence\)\n\}\n\n",
          ]
          for expression in dead:
              rust, removed = re.subn(expression, "", rust, count=1)
              if removed not in (0, 1):
                  raise SystemExit(f"unexpected adapter removal count={removed}")

          test_name = "mirrored_front_parking_home_priming_preserves_v25_lf_and_accepts_rf_settle"
          if test_name not in tests:
              tests += f'''

          #[test]
          fn {test_name}() {{
              assert!(full_sequence_goal_allowed(Leg::Lf, 42, 2052));
              assert!(full_sequence_goal_allowed(Leg::Lf, 42, 2389));
              assert!(full_sequence_goal_allowed(Leg::Rf, 32, 1707));
              assert!(full_sequence_goal_allowed(Leg::Rf, 32, 2054));
              assert!(!full_sequence_goal_allowed(Leg::Rf, 32, 2059));
          }}
          '''

          required = (
              'const TORQUE_LIMIT: u16 = 500;',
              'const GOAL_SPEED: u16 = 160;',
              'const ACCELERATION: u8 = 8;',
              'const COARSE_STEP_TICKS: u16 = 64;',
              'const FINE_STEP_TICKS: u16 = 8;',
              'const BACKOFF_TICKS: u16 = 96;',
              'const RF_FULL_SEQUENCE_ARM_VALUE: &str = "RF_LEG_STATE_MACHINE";',
              'Self::Rf => Some(Self::Rh)',
              'measure_lf_joint_pair_efficient(',
              'global_torque_off_verified()',
          )
          missing = [token for token in required if token not in rust]
          if missing:
              raise SystemExit(f"V25 invariants missing: {missing}")

          rust_path.write_text(rust, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          PY

          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs

      - name: Prove zero warnings and full offline behavior
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='-D warnings' cargo test --package st3215 --all-targets
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_native_observer_contract \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_v42_pinned_launcher

      - name: Commit source-only repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Exact repair already applied."
            exit 0
          fi
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'software/drivers/st3215/src/auto_calibrate/matdog.rs\nsoftware/drivers/st3215/src/auto_calibrate/matdog_test.rs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add software/drivers/st3215/src/auto_calibrate/matdog.rs software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          git commit -m "fix(matdog): mirror V25 parking priming for RF"
          git push origin HEAD:matdog/rf-native-calibrator
