name: MATDOG Native Calibrator Offline Check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - ".github/workflows/matdog-native-observer-check.yml"
      - "protobufs/drivers/st3215/**"
      - "software/drivers/st3215/**"
      - "software/station/bin/station/**"
      - "tools/matdog/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-native-calibrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    name: V25 LF regression and data-driven RF verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p ci-output
          git rev-parse HEAD | tee ci-output/HEAD.txt

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy

      - name: Install Station native dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Enforce V25 observer/launcher authority boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'b9521f97ed0a3cf4d7f39d8712c2fb7a060fa56bbbc2a10b8709742d6b0a5167  tools/matdog/matdog_native_observer_contract.py' | sha256sum -c -
          python3 - <<'PY' | tee ci-output/authority-boundary.log
          from pathlib import Path

          observer = Path("tools/matdog/matdog_native_observer_contract.py").read_text()
          launcher = Path("tools/matdog/matdog_v42_pinned_launcher.py").read_text()
          rust = Path("software/drivers/st3215/src/auto_calibrate/matdog.rs").read_text()

          required_observer = (
              "_matdog_native_authority_observer = True",
              "def validate_running(self, frame: Any) -> None:",
              "self.validate_common(frame)",
          )
          forbidden_observer = (
              "M32", "M42", "HOME_TICK", "current_step",
              "calibration.phase", "CONTROLLED_GOAL_CORRIDORS",
              "CONTROLLED_POSITION_CORRIDORS", "NONPARTICIPATING_MOTOR_IDS",
              "EXPECTED_ACTIVE_TORQUE_LIMIT",
          )
          required_launcher = (
              "require_reviewed_file(RUNNER_PATH",
              "require_reviewed_file(OBSERVER_PATH",
              "matdog_native_observer_contract.install(runner)",
              "runner.EXPECTED_STATION_SHA256 = PINNED_STATION_SHA256",
              "return runner.main()",
          )
          required_rust = (
              'RF_FULL_SEQUENCE_ARM_VALUE',
              'Self::Rf => Some(Self::Rh)',
              'run_leg_full_calibration(',
              'measure_lf_joint_pair_efficient(',
              'global_torque_off_verified()',
              'persistent_freeze_authorized=false',
          )
          missing = [x for x in required_observer if x not in observer]
          missing += [x for x in required_launcher if x not in launcher]
          missing += [x for x in required_rust if x not in rust]
          found = [x for x in forbidden_observer if x in observer]
          if missing or found:
              raise SystemExit(f"missing={missing}; forbidden_in_observer={found}")
          print("V25 authority boundary and RF data port: PASS")
          PY

      - name: Exact LF and RF runner self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test

      - name: Complete Python regressions
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_native_observer_contract \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_v42_pinned_launcher \
            2>&1 | tee ci-output/python-tests.log

      - name: Rust format and complete ST3215 tests
        shell: bash
        run: |
          set -o pipefail
          rustfmt --edition 2021 --check --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/mod.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs \
            2>&1 | tee ci-output/rustfmt.log
          cargo test --package st3215 --all-targets \
            2>&1 | tee ci-output/st3215-tests.log

      - name: Warning-free Station release build
        shell: bash
        run: |
          set -o pipefail
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG offline build gate</title>\n' > "$asset"
          RUSTFLAGS='-D warnings' cargo build --release --package station \
            2>&1 | tee ci-output/station-build.log
          sha256sum target/release/station | tee ci-output/station-release.sha256
          target/release/station --version | tee ci-output/station-version.txt

      - name: Remove CI-only viewer stub
        if: always()
        run: rm -rf software/station/clients/station-viewer/dist

      - name: Upload generic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-native-calibrator-offline-evidence
          path: ci-output/
          if-no-files-found: error
