name: MATDOG Native Calibrator Offline Check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - "protobufs/drivers/st3215/**"
      - "software/drivers/st3215/**"
      - "software/station/bin/station/**"
      - "tools/matdog/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-native-calibrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    name: 24 profiles, RAM-only contract, Rust tests, Station build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Install Station native build dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Prepare verification logs
        run: mkdir -p ci-output

      - name: Enforce canonical data-driven RAM-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ci-output/ram-only-contract.log
          from pathlib import Path
          import re

          source = Path("software/drivers/st3215/src/auto_calibrate/matdog.rs").read_text()
          tests = Path("software/drivers/st3215/src/auto_calibrate/matdog_test.rs").read_text()
          port = Path("software/drivers/st3215/src/port.rs").read_text()
          module = Path("software/drivers/st3215/src/auto_calibrate/mod.rs").read_text()
          profile = Path("tools/matdog/matdog_lf_profile.py").read_text()
          runner = Path("tools/matdog/matdog_headless_auto_calibrate.py").read_text()
          launcher = Path("tools/matdog/matdog_rf_hardware_test.sh").read_text()

          forbidden_source = (
              "EepromRegister",
              "RamRegister::Lock",
              "ST3215Request::",
              "reg_write: Some",
              "reset_calibration: Some",
              "freeze_calibration: Some",
              "action: Some",
              "Offset.address",
              "matdog_v2",
          )
          required_source = (
              "all_profiles",
              "profile_for_arm_value",
              "ram_write_allowed_for_profile",
              "held_targets: Vec<StaticTarget>",
              "verify_static_holds_except",
              "MAX_TELEMETRY_AGE",
              "global_torque_off_verified",
              "GUARD_OVERSHOOT_TICKS",
              "UPPER_30_DELTA",
              "UPPER_85_DELTA",
              "UPPER_90_DELTA",
              "probe_tracking_error_limit",
              "accepted: affine.accepted && contact_witness_accepted",
              "MATDOG_{}_PROFILE_V1|joint=",
              "RF_FULL_SEQUENCE_ARM_VALUE",
              "full_sequence_profile",
              "run_leg_full_calibration",
              "persistent_freeze_authorized=false",
          )
          required_tests = (
              "profile_table_covers_exactly_24_unique_contacts",
              "armed_ram_gate_restricts_registers_values_motors_and_goal_windows",
              "canonical_matdog_source_has_no_eeprom_reset_offset_regwrite_action_or_freeze_path",
              "affine_gate_accepts_real_span_while_fixed_scale_stays_diagnostic",
              "rf_full_sequence_uses_m23_m22_m21_and_m32_parking",
              "rf_full_sequence_goal_corridors_remain_unsigned",
              "rf_state_machine_reuses_one_persistent_engine",
              "rf_profile_record_is_ram_only_and_never_authorizes_persistent_freeze",
              "rf_failure_contract_keeps_global_torque_off_and_isolated_hip_blocking",
          )
          required_other = (
              (port, "matdog_command_allowed_with"),
              (port, "matdog_armed_command_allowed"),
              (module, "mod matdog;"),
              (module, "matdog_ram_write_allowed_for_arm_value"),
              (profile, "q0_affine"),
              (runner, '"RF_LEG_STATE_MACHINE"'),
              (runner, 'frozenset((21, 22, 23, 32))'),
              (launcher, "MATDOG_NATIVE_CALIBRATOR_ARM=RF_LEG_STATE_MACHINE"),
              (launcher, "FINAL=PASS"),
          )

          expected_constants = {
              "HOME_TICK": 2048,
              "GUARD_OVERSHOOT_TICKS": 64,
              "UPPER_30_DELTA": 341,
              "UPPER_85_DELTA": 967,
              "UPPER_90_DELTA": 1024,
              "LF_CONTACT_WITNESS_TOLERANCE_TICKS": 24,
          }
          errors = []
          for name, expected in expected_constants.items():
              match = re.search(rf"(?m)^const {name}: [^=]+ = (-?\d+);$", source)
              if match is None or int(match.group(1)) != expected:
                  errors.append(f"constant {name} is not {expected}")

          found = [token for token in forbidden_source if token in source]
          missing = [token for token in required_source if token not in source]
          missing += [token for token in required_tests if token not in tests]
          missing += [token for text, token in required_other if token not in text]
          if found or missing or errors:
              if found:
                  print(f"forbidden MATDOG source: {found}")
              if missing:
                  print(f"missing MATDOG requirements: {missing}")
              if errors:
                  print(f"MATDOG constants: {errors}")
              raise SystemExit(1)

          print("MATDOG data-driven 24-contact RAM-only affine+witness contract: PASS")
          PY

      - name: MATDOG Rust format check
        shell: bash
        run: |
          set -o pipefail
          rustfmt --edition 2021 --check --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/mod.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs \
            2>&1 | tee ci-output/matdog-rustfmt.log

      - name: ST3215 unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --package st3215 2>&1 | tee ci-output/st3215-tests.log

      - name: Headless runner unit tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_native_observer_contract \
            2>&1 | tee ci-output/headless-runner-tests.log

      - name: Create CI-only Station viewer stub
        shell: bash
        run: |
          set -euo pipefail
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG offline build gate</title>\n' > "$asset"

      - name: Station release build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --package station 2>&1 | tee ci-output/station-build.log
          sha256sum target/release/station | tee ci-output/station-release.sha256

      - name: Remove CI-only viewer stub
        if: always()
        run: rm -rf software/station/clients/station-viewer/dist

      - name: Upload offline verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-native-calibrator-24-contact-offline-logs
          path: ci-output/
          if-no-files-found: error
