name: MATDOG Finalizer Transport Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - "tools/matdog_finalize.patch.gz.b64"

permissions:
  contents: read

jobs:
  transport-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Inspect exact transport bytes
        shell: bash
        run: |
          set +e
          mkdir -p transport-diagnostic
          src=tools/matdog_finalize.patch.gz.b64
          cp "$src" transport-diagnostic/repository-payload.b64
          {
            echo "=== SOURCE ==="
            wc -c "$src"
            sha256sum "$src"
            file "$src"
            echo "newline_count=$(tr -cd '\n' < "$src" | wc -c)"
            echo "carriage_return_count=$(tr -cd '\r' < "$src" | wc -c)"
            echo "=== NORMALIZED BASE64 ==="
            tr -d '\r\n\t ' < "$src" > transport-diagnostic/normalized-payload.b64
            wc -c transport-diagnostic/normalized-payload.b64
            sha256sum transport-diagnostic/normalized-payload.b64
            echo "=== BASE64 DECODE ==="
            base64 --decode transport-diagnostic/normalized-payload.b64 > transport-diagnostic/payload.patch.gz
            decode_status=$?
            echo "decode_status=$decode_status"
            wc -c transport-diagnostic/payload.patch.gz
            sha256sum transport-diagnostic/payload.patch.gz
            echo "=== GZIP TEST ==="
            gzip -t transport-diagnostic/payload.patch.gz
            gzip_status=$?
            echo "gzip_status=$gzip_status"
            if [ "$gzip_status" -eq 0 ]; then
              gzip -dc transport-diagnostic/payload.patch.gz > transport-diagnostic/payload.patch
              echo "=== DECODED PATCH ==="
              wc -c transport-diagnostic/payload.patch
              sha256sum transport-diagnostic/payload.patch
              head -n 12 transport-diagnostic/payload.patch
            fi
          } > transport-diagnostic/output.txt 2>&1
          exit 0

      - name: Upload exact transport diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: matdog-finalizer-transport-diagnostic
          path: transport-diagnostic/
          if-no-files-found: error
