name: MATDOG RF Canonical Guard Repair

on:
  push:
    branches:
      - matdog/rf-native-calibrator
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matdog-rf-canonical-guard-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RF branch
        uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard expected input revision
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$head" in
            763c767d085bbb7c5025886c89f34191a11e9722) ;;
            *)
              if grep -q 'fn next_guard_bounded_target(' software/drivers/st3215/src/auto_calibrate/matdog.rs; then
                echo "repair already applied on $head"
                exit 0
              fi
              echo "unexpected unpatched HEAD: $head" >&2
              exit 1
              ;;
          esac

      - name: Apply only the general V25 guard-endpoint correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('software/drivers/st3215/src/auto_calibrate/matdog.rs')
          test_path = Path('software/drivers/st3215/src/auto_calibrate/matdog_test.rs')
          source = source_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          marker = 'fn next_guard_bounded_target('
          if marker in source:
              print('canonical guard repair already present')
              raise SystemExit(0)

          old_loop = '''            let next_target = advance_tick(target, self.profile.probe_sign, step_ticks)?;
            if passed_guard(
                next_target,
                self.profile.guard_tick,
                self.profile.probe_sign,
            ) {
                return Err(format!(
                    "{} travel guard reached without contact: next={}, URDF={}, guard={}",
                    self.profile.label,
                    next_target,
                    self.profile.urdf_limit_tick,
                    self.profile.guard_tick
                )
                .into());
            }
            self.set_motor_goal_verified(motor_id, next_target).await?;
'''
          new_loop = '''            let Some(next_target) = next_guard_bounded_target(
                target,
                self.profile.probe_sign,
                step_ticks,
                self.profile.guard_tick,
            )? else {
                return Err(format!(
                    "{} travel guard reached without contact: current={}, URDF={}, guard={}",
                    self.profile.label,
                    target,
                    self.profile.urdf_limit_tick,
                    self.profile.guard_tick
                )
                .into());
            };
            self.set_motor_goal_verified(motor_id, next_target).await?;
'''
          count = source.count(old_loop)
          if count != 1:
              raise SystemExit(f'expected one canonical approach loop, found {count}')
          source = source.replace(old_loop, new_loop, 1)

          old_helper = '''fn advance_tick(value: u16, sign: i8, amount: u16) -> Result<u16, DynError> {
    let next = i32::from(value) + i32::from(sign) * i32::from(amount);
    u16::try_from(next)
        .ok()
        .filter(|tick| *tick <= protocol::MAX_ANGLE_STEP)
        .ok_or_else(|| format!("unsigned GoalPosition out of range: {next}").into())
}

fn motion_timeout_for_distance'''
          new_helper = '''fn advance_tick(value: u16, sign: i8, amount: u16) -> Result<u16, DynError> {
    let next = i32::from(value) + i32::from(sign) * i32::from(amount);
    u16::try_from(next)
        .ok()
        .filter(|tick| *tick <= protocol::MAX_ANGLE_STEP)
        .ok_or_else(|| format!("unsigned GoalPosition out of range: {next}").into())
}

// Preserve the reviewed V25 guard exactly. Fixed coarse/fine increments may
// not divide the remaining travel evenly; the final command therefore lands
// on the existing guard instead of skipping from the last safe target to a
// value beyond it. No target outside the guard is ever generated.
fn next_guard_bounded_target(
    value: u16,
    sign: i8,
    amount: u16,
    guard: u16,
) -> Result<Option<u16>, DynError> {
    if passed_guard(value, guard, sign) {
        return Err(format!(
            "current target {value} is already beyond guard {guard}"
        )
        .into());
    }
    if value == guard {
        return Ok(None);
    }

    let next = i32::from(value) + i32::from(sign) * i32::from(amount);
    let candidate = u16::try_from(next)
        .ok()
        .filter(|tick| *tick <= protocol::MAX_ANGLE_STEP);
    if candidate
        .map(|tick| passed_guard(tick, guard, sign))
        .unwrap_or(true)
    {
        Ok(Some(guard))
    } else {
        Ok(candidate)
    }
}

fn motion_timeout_for_distance'''
          count = source.count(old_helper)
          if count != 1:
              raise SystemExit(f'expected one advance_tick helper, found {count}')
          source = source.replace(old_helper, new_helper, 1)

          test_marker = 'fn guard_bounded_final_step_is_direction_symmetric_and_never_extends_the_guard()'
          if test_marker in tests:
              raise SystemExit('guard regression tests unexpectedly already present')
          tests += r'''

#[test]
fn guard_bounded_final_step_is_direction_symmetric_and_never_extends_the_guard() {
    // Exact last coarse targets from the hardware LF pass and RF attempt.
    assert_eq!(
        next_guard_bounded_target(1420, -1, COARSE_STEP_TICKS, 1387).unwrap(),
        Some(1387)
    );
    assert_eq!(
        next_guard_bounded_target(2676, 1, COARSE_STEP_TICKS, 2709).unwrap(),
        Some(2709)
    );

    // Reaching the reviewed guard ends travel; no command beyond it exists.
    assert_eq!(
        next_guard_bounded_target(1387, -1, COARSE_STEP_TICKS, 1387).unwrap(),
        None
    );
    assert_eq!(
        next_guard_bounded_target(2709, 1, COARSE_STEP_TICKS, 2709).unwrap(),
        None
    );

    // Ordinary increments remain byte-for-byte equivalent to advance_tick().
    assert_eq!(
        next_guard_bounded_target(1984, -1, COARSE_STEP_TICKS, 1387).unwrap(),
        Some(1920)
    );
    assert_eq!(
        next_guard_bounded_target(2112, 1, COARSE_STEP_TICKS, 2709).unwrap(),
        Some(2176)
    );
}

#[test]
fn rf_m22_real_trace_confirms_contact_at_the_existing_guard_without_widening_it() {
    let profile = profile_for_arm_value("RF_UPPER_M22_MIN").unwrap();
    assert_eq!(profile.urdf_limit_tick, 2645);
    assert_eq!(profile.guard_tick, 2709);
    assert_eq!(profile.probe_sign, 1);

    let baseline = BaselineStats {
        median_current: 0,
        mad_current: 0,
    };
    let mut detector = HybridContactDetector::new_for_profile(
        2112,
        baseline,
        &profile,
    );
    let target = profile.guard_tick;
    let sample = observation(2667, 0, 1, target);

    assert_eq!(detector.observe(sample, target), ContactState::FreeMotion);
    for _ in 0..TARGET_STARTUP_SAMPLES {
        assert_eq!(detector.observe(sample, target), ContactState::FreeMotion);
    }
    assert_eq!(
        detector.observe(sample, target),
        ContactState::ContactSuspected
    );
    assert_eq!(
        detector.observe(sample, target),
        ContactState::ContactSuspected
    );
    assert_eq!(
        detector.observe(sample, target),
        ContactState::ContactConfirmed
    );
}

#[test]
fn lf_m12_mirror_uses_the_same_existing_guard_rule() {
    let profile = profile_for_arm_value("LF_UPPER_M12_MIN").unwrap();
    assert_eq!(profile.urdf_limit_tick, 1451);
    assert_eq!(profile.guard_tick, 1387);
    assert_eq!(profile.probe_sign, -1);

    let baseline = BaselineStats {
        median_current: 0,
        mad_current: 0,
    };
    let mut detector = HybridContactDetector::new_for_profile(
        1984,
        baseline,
        &profile,
    );
    let target = profile.guard_tick;
    let sample = observation(1434, 0, 1, target);

    assert_eq!(detector.observe(sample, target), ContactState::FreeMotion);
    for _ in 0..TARGET_STARTUP_SAMPLES {
        assert_eq!(detector.observe(sample, target), ContactState::FreeMotion);
    }
    assert_eq!(
        detector.observe(sample, target),
        ContactState::ContactSuspected
    );
    assert_eq!(
        detector.observe(sample, target),
        ContactState::ContactSuspected
    );
    assert_eq!(
        detector.observe(sample, target),
        ContactState::ContactConfirmed
    );
}
'''

          source_path.write_text(source, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo 'no source change required'
            exit 0
          fi

          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs

      - name: Verify canonical temperature logic and complete software gates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          port = Path('software/drivers/st3215/src/port.rs').read_text()
          runner = Path('tools/matdog/matdog_headless_auto_calibrate.py').read_text()
          required = (
              'MATDOG_THERMAL_CONFIRMATION_READS: usize = 3',
              'over_limit >= 2',
              'matdog_direct_temperature_never_converts_repeated_false_spikes_to_heat',
              'superseded_bulk_temperature_is_replaced_by_confirmed_latest',
          )
          combined = port + runner + Path('software/drivers/st3215/src/port.rs').read_text()
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit(f'canonical V25 temperature contract missing: {missing}')
          PY
          rustfmt --edition 2021 --check --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/mod.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs
          RUSTFLAGS='-D warnings' cargo test --package st3215 --all-targets
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_native_observer_contract \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_v42_pinned_launcher
          git diff --check

      - name: Commit source-only correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'software/drivers/st3215/src/auto_calibrate/matdog.rs'
          test "${changed[1]}" = 'software/drivers/st3215/src/auto_calibrate/matdog_test.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'fix(matdog): honor the existing guard on the final bounded step'
          git push origin HEAD:matdog/rf-native-calibrator
