name: MATDOG LF Freeze Materialize

on:
  push:
    branches:
      - matdog/lf-q0-contract-v42
    paths:
      - ".github/workflows/matdog-lf-freeze-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matdog-lf-freeze-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: matdog/lf-q0-contract-v42
          fetch-depth: 0
          persist-credentials: true

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Install Station build dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Apply byte-identical reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 tools/matdog/fix_lf_upgrade_transformer_v2.py
          python3 tools/matdog/fix_lf_upgrade_transformer_v3.py
          python3 tools/matdog/apply_lf_freeze_source_upgrade.py --apply
          python3 tools/matdog/fix_lf_upgrade_tests_v4.py
          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            software/drivers/st3215/src/bin/matdog_lf_freeze.rs
          git diff --check

      - name: Re-run complete verification before commit
        shell: bash
        run: |
          set -euo pipefail
          cargo test --package st3215 --all-targets
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_lf_profile
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG LF materialization</title>\n' > "$asset"
          cargo build --release --package station
          cargo build --release --package st3215 --bin matdog_lf_freeze
          rm -rf software/station/clients/station-viewer/dist

      - name: Remove one-time transformation infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            tools/matdog/apply_lf_freeze_source_upgrade.py \
            tools/matdog/fix_lf_upgrade_transformer_v2.py \
            tools/matdog/fix_lf_upgrade_transformer_v3.py \
            tools/matdog/fix_lf_upgrade_tests_v4.py \
            .github/workflows/matdog-lf-freeze-upgrade-check.yml \
            .github/workflows/matdog-lf-freeze-upgrade-check-v2.yml \
            .github/workflows/matdog-lf-freeze-materialize.yml
          git diff --check

      - name: Commit reviewed final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(matdog): materialize LF measurement and freeze pipeline"
          git push origin HEAD:matdog/lf-q0-contract-v42
