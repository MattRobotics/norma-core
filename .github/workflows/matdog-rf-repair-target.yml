name: MATDOG RF Target Repair Gate

on:
  pull_request:
    branches:
      - matdog/rf-native-calibrator

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply canonical source repair
        run: |
          set -euo pipefail
          python3 tools/matdog/apply_rf_canonical_guard_repair.py
          rustfmt --edition 2021 --config skip_children=true \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs
      - name: Verify V25 temperature and guard contracts
        run: |
          set -euo pipefail
          grep -q 'MATDOG_THERMAL_CONFIRMATION_READS: usize = 3' software/drivers/st3215/src/port.rs
          grep -q 'over_limit >= 2' software/drivers/st3215/src/port.rs
          grep -q 'matdog_direct_temperature_never_converts_repeated_false_spikes_to_heat' software/drivers/st3215/src/port.rs
          grep -q 'superseded_bulk_temperature_is_replaced_by_confirmed_latest' tools/matdog/test_matdog_headless_auto_calibrate.py
          RUSTFLAGS='-D warnings' cargo test --package st3215 --all-targets
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg LF --self-test
          python3 tools/matdog/matdog_headless_auto_calibrate.py --leg RF --self-test
          python3 -m unittest -v \
            tools.matdog.test_matdog_headless_auto_calibrate \
            tools.matdog.test_matdog_native_observer_contract \
            tools.matdog.test_matdog_lf_profile \
            tools.matdog.test_matdog_v42_pinned_launcher
          git diff --check
      - name: Commit source-only repair to RF branch
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'software/drivers/st3215/src/auto_calibrate/matdog.rs'
          test "${changed[1]}" = 'software/drivers/st3215/src/auto_calibrate/matdog_test.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'fix(matdog): honor the existing guard on the final bounded step'
          git push origin HEAD:matdog/rf-native-calibrator
