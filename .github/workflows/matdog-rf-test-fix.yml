name: MATDOG RF Test Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-rf-test-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'matdog/rf-native-calibrator'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RF branch
        uses: actions/checkout@v4
        with:
          ref: matdog/rf-native-calibrator
          fetch-depth: 0

      - name: Apply exact compile fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("software/drivers/st3215/src/auto_calibrate/matdog_test.rs")
          text = path.read_text()
          old = "assert_eq!(session.parking_motor_id(), 32);"
          new = "assert_eq!(session.parking_motor_id(), Ok(32));"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one test expression, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = "software/drivers/st3215/src/auto_calibrate/matdog_test.rs"
          git config user.name "MattRobotics RF CI"
          git config user.email "actions@users.noreply.github.com"
          git add software/drivers/st3215/src/auto_calibrate/matdog_test.rs
          git commit -m "test(matdog): compare RF parking result explicitly"
          git push origin HEAD:matdog/rf-native-calibrator
