name: MATDOG Rust Test Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-test-diagnostic.yml"

permissions:
  contents: read
  actions: read

jobs:
  rust-test-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download generated source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matdog-source
          gh run download 30165101583 \
            --repo "${{ github.repository }}" \
            --name matdog-source-diagnostic \
            --dir /tmp/matdog-source
          cp /tmp/matdog-source/generated/port.rs software/drivers/st3215/src/port.rs
          cp /tmp/matdog-source/generated/mod.rs software/drivers/st3215/src/auto_calibrate/mod.rs
          cp /tmp/matdog-source/generated/matdog_v2.rs software/drivers/st3215/src/auto_calibrate/matdog_v2.rs
          cp /tmp/matdog-source/generated/matdog_v2_test.rs software/drivers/st3215/src/auto_calibrate/matdog_v2_test.rs

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Capture ST3215 test output
        shell: bash
        run: |
          mkdir -p test-diagnostic
          set +e
          cargo test --package st3215 > test-diagnostic/cargo-test.txt 2>&1
          status=$?
          echo "$status" > test-diagnostic/status.txt
          exit 0

      - name: Upload ST3215 test diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: matdog-rust-test-diagnostic
          path: test-diagnostic/
          if-no-files-found: error
