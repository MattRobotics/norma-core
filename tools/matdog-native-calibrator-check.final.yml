name: MATDOG Native Calibrator Offline Check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-native-calibrator-check.yml"
      - "protobufs/drivers/st3215/**"
      - "software/drivers/st3215/**"
      - "software/station/bin/station/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-native-calibrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-foundation:
    name: 24 profiles, RAM-only contract, Rust tests, Station build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v4

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "23.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Install native Station build dependency
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Prepare verification logs
        run: mkdir -p ci-output

      - name: Enforce MATDOG 24-contact RAM-only source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ci-output/ram-only-contract.log
          from pathlib import Path

          source_path = Path("software/drivers/st3215/src/auto_calibrate/matdog.rs")
          test_path = Path("software/drivers/st3215/src/auto_calibrate/matdog_test.rs")
          port_path = Path("software/drivers/st3215/src/port.rs")
          mod_path = Path("software/drivers/st3215/src/auto_calibrate/mod.rs")
          source = source_path.read_text()
          tests = test_path.read_text()
          port = port_path.read_text()
          mod = mod_path.read_text()

          forbidden_source = (
              "EepromRegister",
              "RamRegister::Lock",
              "ST3215Request::",
              "reg_write: Some",
              "reset: Some",
              "reset_calibration: Some",
              "freeze_calibration: Some",
              "action: Some",
              "Offset.address",
              "matdog_v2",
          )
          forbidden_port = (
              "write.motor_id != 12",
              "matdog_pilot_is_armed",
          )
          required_source = (
              "all_profiles",
              "profile_for_arm_value",
              "ram_write_allowed_for_profile",
              "held_targets: Vec<StaticTarget>",
              "verify_static_holds_except",
              "MAX_TELEMETRY_AGE",
              "prerequisite_restore_order",
              "global_torque_off_verified",
              "GUARD_OVERSHOOT_TICKS",
              "UPPER_30_DELTA",
              "UPPER_50_DELTA",
              "UPPER_90_DELTA",
          )
          required_tests = (
              "profile_table_covers_exactly_24_unique_contacts",
              "front_lower_restore_order_keeps_rear_parking_until_active_leg_is_home",
              "armed_ram_gate_restricts_registers_values_motors_and_goal_windows",
              "canonical_matdog_source_has_no_eeprom_reset_offset_regwrite_action_or_freeze_path",
          )
          required_port = (
              "matdog_command_allowed_with",
              "matdog_armed_command_allowed",
              "native MATDOG profile arming is active",
          )
          required_mod = (
              "mod matdog;",
              "matdog_ram_write_allowed_for_arm_value",
          )

          found = [token for token in forbidden_source if token in source]
          found += [token for token in forbidden_port if token in port]
          missing = [token for token in required_source if token not in source]
          missing += [token for token in required_tests if token not in tests]
          missing += [token for token in required_port if token not in port]
          missing += [token for token in required_mod if token not in mod]

          stale_files = [
              path for path in (
                  Path("software/drivers/st3215/src/auto_calibrate/matdog_v2.rs"),
                  Path("software/drivers/st3215/src/auto_calibrate/matdog_v2_test.rs"),
              )
              if path.exists()
          ]
          if stale_files:
              found.extend(str(path) for path in stale_files)

          if found or missing:
              if found:
                  print(f"forbidden or stale MATDOG source: {found}")
              if missing:
                  print(f"missing MATDOG source requirements: {missing}")
              raise SystemExit(1)

          print("MATDOG 24-contact RAM-only source contract: PASS")
          PY

      - name: Repository-wide Rust format audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee ci-output/cargo-fmt.log

      - name: MATDOG changed Rust format check
        shell: bash
        run: |
          set -o pipefail
          rustfmt --edition 2021 --check --config skip_children=true \
            software/drivers/st3215/src/port.rs \
            software/drivers/st3215/src/auto_calibrate/mod.rs \
            software/drivers/st3215/src/auto_calibrate/matdog.rs \
            software/drivers/st3215/src/auto_calibrate/matdog_test.rs \
            2>&1 | tee ci-output/matdog-rustfmt.log

      - name: ST3215 unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --package st3215 2>&1 | tee ci-output/st3215-tests.log

      - name: Create CI-only minimal Station viewer asset
        shell: bash
        run: |
          set -euo pipefail
          asset=software/station/clients/station-viewer/dist/index.html
          test ! -e "$asset"
          mkdir -p "$(dirname "$asset")"
          printf '<!doctype html><title>MATDOG offline build gate</title>\n' > "$asset"
          echo "Created ignored CI-only viewer stub; no product asset is committed." \
            | tee ci-output/station-viewer-stub.log

      - name: Station release build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --package station 2>&1 | tee ci-output/station-build.log

      - name: Remove CI-only viewer asset
        if: always()
        run: rm -rf software/station/clients/station-viewer/dist

      - name: Upload offline verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-native-calibrator-24-contact-offline-logs
          path: ci-output/
          if-no-files-found: error
